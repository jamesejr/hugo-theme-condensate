{{ define "main" }}
<header class="page-header">
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="meta">{{ i18n "posts_count" (len .Pages) }}</div>
</header>
<div class="entries">
  {{- $pag := .Paginate .Pages }}
  {{- range $pag.Pages }}{{ partial "entry.html" . }}{{ end }}
</div>
{{ partial "pagination.html" . }}
{{ end }}
