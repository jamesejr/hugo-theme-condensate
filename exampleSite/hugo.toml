baseURL = "https://example.com/"
locale = "en-US"
title = "Jane Doe"
theme = "hugo-theme-condensate"

[pagination]
  pagerSize = 5

[taxonomies]
  tag = "tags"

[markup.highlight]
  noClasses = false

[params]
  # "system" (default), "light" or "dark"
  colorScheme = "system"
  showThemeToggle = true
  # Preview length in lines (default 4, 0 = full summary).
  # summaryLines = 4
  tagline = "A minimal, typography-first Hugo theme inspired by Vapor."
  # Path under assets/ (or static/). Use a roughly square image.
  avatar = "images/avatar.svg"
  # Optional: zoom in and centre on a point if your photo is a wide shot.
  # avatarScale = 1.4
  # avatarFocus = "51% 44%"

# Optional: override the light and dark palettes (hex, rgb() or hsl()).
# [params.light]
#   background = "#faf6ee"
#   accent = "#9a4a1a"
# [params.dark]
#   background = "#1e1e2e"
#   accent = "hsl(265 80% 75%)"

[menus]
  [[menus.main]]
    name = "Posts"
    url = "/"
    weight = 10
  [[menus.main]]
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 30

